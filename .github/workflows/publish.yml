name: Publish Trading Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: modules/signals_trading_web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON
        run: |
          python -m json.tool data/trades.json > /dev/null
          python -m json.tool data/performance.json > /dev/null
          python -m json.tool data/market.json > /dev/null

      - name: Validate Python
        run: |
          python -m compileall publisher tests

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4